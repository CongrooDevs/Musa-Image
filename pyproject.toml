[project]
name = "gemini-image-api"
version = "0.1.0"
description = "MCP server + CLI para generar/editar imagenes con tu sesion web de Gemini (sin API key de pago)"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "curl-cffi>=0.7",
  "loguru>=0.7",
  "fastmcp>=2.10",
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "pillow>=10.3",
  "filelock>=3.14",
  "starlette>=1.0",
  "uvicorn>=0.30",
  "sse-starlette>=2.0",
  "python-multipart>=0.0.9",
  "svglib>=1.5",
  "pypdfium2>=4.0,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
gia = "gemini_image_api.cli:main"
gia-mcp = "gemini_image_api.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_image_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
